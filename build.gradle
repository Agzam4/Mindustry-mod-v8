apply plugin: "java"
apply plugin: "eclipse"

sourceSets.main.java.srcDirs = ["src"]

ext{
    // Mindustry version to depend on.
    // Valid values:
    // - latest: depend on the latest release of mindustry
    // - be: depend on the very latest commit of mindustry
    // - v<number>: depend on a specific version
    mindustryVersion = "v159.7"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

repositories{
    mavenCentral()

    //Downloads the dependencies JAR file from Mindustry releases; does not use any real repository. Surprisingly, this is the most reliable option.
    ivy{
        url = 'https://github.com/'
        patternLayout{ artifact(
            (mindustryVersion == "latest" ? '/[organisation]/[module]/releases/[revision]/download/dependencies.jar' : //latest stable release
            mindustryVersion == "be" ? '/[organisation]/[module]/releases/download/master/[revision].jar' : //latest commit (BE)
            '/[organisation]/[module]/releases/download/[revision]/dependencies.jar')) //specific release
        }
        metadataSources{ artifact() }

        content{
            if(mindustryVersion == "be"){
                //BE artifact version is always 'latest'
                includeVersion("Anuken", "MindustryBuilds", "latest")
            }else{
                includeVersion("Anuken", "Mindustry", mindustryVersion)
            }
        }
    }
}

java{
    targetCompatibility = JavaVersion.VERSION_17
    sourceCompatibility = JavaVersion.VERSION_17
}

dependencies{
    compileOnly mindustryVersion == "be" ? "Anuken:MindustryBuilds:latest" : "Anuken:Mindustry:$mindustryVersion"
}

tasks.register('jarAndroid'){
    dependsOn "jar"
    def projectName = project.name

    doLast{
        if(!sdkRoot || !new File(sdkRoot).exists()) throw new GradleException("No valid Android SDK found. Ensure that ANDROID_HOME is set to your Android SDK directory.")

        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find{ f -> new File(f, "android.jar").exists() }

        if(!platformRoot) throw new GradleException("No android.jar found. Ensure that you have an Android platform installed.")

		// 36.1.0/
		def buildToolsRoot = new File("$sdkRoot/build-tools/").listFiles().sort().find{ f -> new File(f, isWindows ? "d8.bat" : "d8").exists() }
		// .reverse()
        
        def d8 = isWindows ? "d8.bat" : "d8"
        if(buildToolsRoot) d8 = new File(buildToolsRoot, isWindows ? "d8.bat" : "d8").absolutePath

 		def d8Binary = new File(buildToolsRoot, isWindows ? "d8.bat" : "d8").absolutePath
		println "d8: $d8Binary" 
		
        //collect dependencies needed for desugaring
        def dependencies = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")]).collect{ "--classpath $it.path" }.join(" ")
       
       	def buildDir = new File(project.buildDir, "libs")

        //dex and desugar files - this requires d8 in your PATH
        def command = "$d8 $dependencies --min-api 21 --output ${projectName}Android.jar ${projectName}Desktop.jar"
        println "platform: $platformRoot"
        println "execute: $command"
        println "build: $buildDir"
        command.execute(null, buildDir).waitForProcessOutput(System.out, System.err)
    }
}


jar{
    archiveFileName = "${project.name}Desktop.jar"

    from{
        configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }
    }

    from(projectDir){
        include "mod.hjson"
    }

    from("assets/"){
        include "**"
    }
    
    doLast{
		def pathfrom = file("build/libs/${project.archivesBaseName}Desktop.jar");
		if(!pathfrom.exists()) throw new GradleException("$pathfrom not found");
		
    	if(isWindows){
			def path = file(System.getenv("AppData") + '/Mindustry/mods');
	
			if(!path.exists()) throw new GradleException("$path not found");
		
			System.out.println("Copying from $pathfrom to $path");
    		copy {
    			from "$pathfrom"
    			into "$path"
    		}
    		println "copy: ${pathfrom} to ${path}"
    	}else{
        	def xdg = System.getenv("XDG_DATA_HOME")
        	def baseDir = (xdg != null && !xdg.trim().isEmpty())  ? xdg  : System.getProperty("user.home") + "/.local/share"
        	def path =  file("${baseDir}/Mindustry/mods")
	
			if(!path.exists()) throw new GradleException("$path not found");
		
			System.out.println("Copying from $pathfrom to $path");
    		copy {
    			from "$pathfrom"
    			into "$path"
    		}
    		println "copy: ${pathfrom} to ${path}"
    	}
    }
}

tasks.register('deploy', Jar){
    def projectName = project.name
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${projectName}.jar"

    from{ [zipTree("build/libs/${projectName}Desktop.jar"), zipTree("build/libs/${projectName}Android.jar")] }

    doLast{
        delete{
            delete "build/libs/${projectName}Android.jar"
        }
    }
}

